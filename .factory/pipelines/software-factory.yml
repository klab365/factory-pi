name: Work on factory-pi
inputs:
  goal:
    description: What should the factory implement or change in this repository?
    required: true

steps:
  - id: plan
    name: Plan requested change
    agent: planner
    maxVisits: 2
    transitions:
      completed: implement
    task: |-
      Create a concise implementation plan for this goal, based on the repository and its conventions:

      ${{ inputs.goal }}

      Include concrete tasks and acceptance criteria. Do not modify files.

  - id: implement
    name: Implement requested change
    agent: builder
    maxVisits: 3
    transitions:
      completed: verify
    task: |-
      Work in the current factory-pi repository and implement this goal:

      ${{ inputs.goal }}

      Inspect the relevant files first, make the required changes, and run focused checks if useful.
      Address prior reviewer feedback if provided:
      ${{ steps.review.feedback }}

      Plan:
      ${{ steps.plan.summary }}

      Address the latest human feedback if provided:
      ${{ steps.human_feedback.response }}

  - id: verify
    name: Verify implementation
    shell: mise run check
    transitions:
      completed: review

  - id: review
    name: Review implementation
    agent: reviewer
    maxVisits: 3
    transitions:
      approved: accept
      changes_requested: implement
    task: |-
      Review the changes made in this run for correctness, regressions, and missing tests.
      Focus on the requested goal: ${{ inputs.goal }}.
      Report actionable findings with file and line references. Do not modify files.
      Return status `approved` when clean, otherwise `changes_requested`
      and put actionable fixes in `feedback`.

      When approved, include three string fields in the factory-result JSON:
      - `prTitle`: a Conventional Commit subject used as both the PR title and commit
        subject, matching `<type>(<optional scope>): <imperative summary>` (for example,
        `fix(release): use staged npm publishing`). Keep it on one line, at most 72
        characters, and accurately describe the change. Do not copy the request, issue
        URL, or use a generic title.
      - `prSummary`: Markdown bullets describing the changes in the diff.
      - `prVerification`: Markdown bullets with the checks actually run and their results.

      Do not include issue-closing directives in any of these fields; the publisher agent
      adds them based on issue URLs in the goal.

  - id: accept
    name: Human acceptance
    maxVisits: 3
    human:
      prompt: |-
        Approve the reviewed changes, commit and push this branch, and open or update its PR?

        Title / commit subject: ${{ steps.review.prTitle }}

        ## Summary
        ${{ steps.review.prSummary }}

        ## Verification
        ${{ steps.review.prVerification }}
      choices: [approved, change_requested, rejected]
    transitions:
      approved: publish
      change_requested: human_feedback
      rejected: end

  - id: human_feedback
    name: Request human feedback
    maxVisits: 5
    human:
      prompt: What should the builder change?
    transitions:
      completed: implement

  - id: publish
    name: Publish approved changes
    agent: publisher
    task: |-
      The human has approved publishing the reviewed changes. Commit, push, and create or
      update the pull request following your instructions.

      Goal: ${{ inputs.goal }}
      Approved Conventional Commit subject / PR title: ${{ steps.review.prTitle }}

      ## Approved summary
      ${{ steps.review.prSummary }}

      ## Approved verification
      ${{ steps.review.prVerification }}
    transitions:
      completed: end
