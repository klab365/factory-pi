name: Work on factory-pi
inputs:
  goal:
    description: What should the factory implement or change in this repository?
    required: true

steps:
  - id: implement
    name: Implement requested change
    agent: builder
    maxVisits: 3
    transitions:
      completed: review
    task: |-
      Work in the current factory-pi repository and implement this goal:

      ${{ inputs.goal }}

      Inspect the relevant files first, make the required changes, and run focused checks if useful.
      Address prior reviewer feedback if provided:
      ${{ steps.review.feedback }}

      Address the latest human feedback if provided:
      ${{ steps.human_feedback.response }}

  - id: review
    name: Review implementation
    agent: reviewer
    maxVisits: 3
    transitions:
      approved: accept
      changes_requested: implement
    task: |-
      Review the changes made in this run for correctness, regressions, and missing tests.
      Focus on the requested goal: ${{ inputs.goal }}.
      Run `mise run check` and report its result.
      Report actionable findings with file and line references. Do not modify files.
      Return status `approved` when clean, otherwise `changes_requested`
      and put actionable fixes in `feedback`.

      When approved, include three string fields in the factory-result JSON:
      - `prTitle`: an English imperative title for both the PR and the commit subject,
        on one line, at most 72 characters, describing the actual change. Do not copy
        the request, issue URL, or a generic title.
      - `prSummary`: Markdown bullets describing the changes in the diff.
      - `prVerification`: Markdown bullets with the checks actually run and their results.
      Omit section headings and issue closing references from these fields; the publisher adds them.

  - id: accept
    name: Human acceptance
    maxVisits: 3
    human:
      prompt: |-
        Approve the reviewed changes, commit and push this branch, and open or update its PR?

        Title / commit subject: ${{ steps.review.prTitle }}

        ## Summary
        ${{ steps.review.prSummary }}

        ## Verification
        ${{ steps.review.prVerification }}
      choices: [approved, change_requested, rejected]
    transitions:
      approved: publish
      change_requested: human_feedback
      rejected: end

  - id: human_feedback
    name: Request human feedback
    maxVisits: 5
    human:
      prompt: What should the builder change?
    transitions:
      completed: implement

  - id: publish
    name: Publish approved changes
    shell:
      command: >-
        python3 scripts/publish-pr.py
        ${{ inputs.goal }}
        ${{ steps.review.prTitle }}
        ${{ steps.review.prSummary }}
        ${{ steps.review.prVerification }}
      outputs: {stdout: true}
    transitions:
      completed: end
