name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install toolchain and dependencies
        uses: jdx/mise-action@v3
        with:
          install: true

      - name: Run checks
        run: mise run check

      - name: Smoke-test packed extension without install scripts
        run: bun run test:package
