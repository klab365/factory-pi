[tools]
bun = "1.4.4"
node = "24.22.0"
python = "3.13.16"

[hooks]
postinstall = "bun install --frozen-lockfile"

[tasks.format]
run = "bun run format"

[tasks.check-format]
run = "bun run check-format"

[tasks.lint]
run = "bun run lint"

[tasks.tests]
run = "bun run test"

[tasks.typecheck]
run = "bun run typecheck"

[tasks.validate]
run = "bun run validate"

[tasks.check]
depends = ["check-format", "lint", "tests", "typecheck", "validate"]

[tasks.dev-pi]
run = "bun run src/pi-test.ts"

[tasks."docs:dev"]
description = "Start the Starlight documentation dev server"
run = "bun run docs:dev"

[tasks."docs:build"]
description = "Build the documentation for GitHub Pages"
run = "bun run docs:build"

[tasks."docs:preview"]
description = "Build and preview the production documentation locally"
depends = ["docs:build"]
run = "bun run docs:preview"
