name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  publish:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - uses: jdx/mise-action@v3
        with:
          install: true
      - name: Verify release
        run: mise run check
      - name: Pack Pi extension
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/factory-npm"
          archive=$(npm pack --pack-destination "$RUNNER_TEMP/factory-npm")
          echo "archive=$RUNNER_TEMP/factory-npm/$archive" >> "$GITHUB_OUTPUT"
      - name: Stage Pi extension via npm Trusted Publishing
        run: npm exec --yes --package=npm@11.19.1 -- npm stage publish "$ARCHIVE" --access public --registry https://registry.npmjs.org
        env:
          ARCHIVE: ${{ steps.pack.outputs.archive }}
